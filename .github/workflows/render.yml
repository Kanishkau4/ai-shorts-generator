name: Render Video
on:
  repository_dispatch:
    types: [render-video]

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg chromium-browser

      - name: Install NPM Dependencies
        run: npm install

      - name: Render Video
        env:
          INPUT_PROPS: ${{ github.event.client_payload.inputProps }}
          SERIES_ID: ${{ github.event.client_payload.seriesId }}
          VIDEO_INDEX: ${{ github.event.client_payload.videoIndex }}
          VIDEO_ID: ${{ github.event.client_payload.videoId }}
          NEXT_PUBLIC_SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: npx ts-node scripts/render-on-github.ts
